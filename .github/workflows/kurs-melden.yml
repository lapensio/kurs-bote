# Kurs-Bote: NUR NOCH MANUELLER RESERVE-MELDER (seit 02.09.2026).
# Die 10-Minuten-Kurse meldet die «Datenbank-Uhr» in Supabase (pg_cron-Job
# «kurse-melden-10min» ruft die Supabase-Funktion kurse-melden auf – derselbe
# Ablauf wie kurse-melden.mjs hier). Grund: GitHub liess den 10-Minuten-
# Zeitplan dieses Repos nur alle 2 bis 4 Stunden laufen (Zeitpläne sind bei
# GitHub «best effort»). Dieser Workflow bleibt als Reserve: im Actions-Tab
# von Hand startbar, wenn die Datenbank-Uhr einmal ausfällt.
name: Kurs-Melden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurs-melden
  cancel-in-progress: false

jobs:
  melden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kurse holen und melden
        env:
          KURS_GEHEIM: ${{ secrets.KURS_GEHEIM }}
        run: node kurse-melden.mjs
